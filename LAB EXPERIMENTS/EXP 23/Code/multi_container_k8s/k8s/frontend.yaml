apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
      - name: frontend
        image: YOUR_DOCKERHUB_USERNAME/k8s-task-frontend:latest
        imagePullPolicy: Always
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector: {app: frontend}
  ports:
  - {port: 80, targetPort: 80, nodePort: 30080}
