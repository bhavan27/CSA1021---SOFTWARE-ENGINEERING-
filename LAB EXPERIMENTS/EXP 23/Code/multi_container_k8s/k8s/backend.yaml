apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
      - name: backend
        image: YOUR_DOCKERHUB_USERNAME/k8s-task-backend:latest
        imagePullPolicy: Always
        ports: [{containerPort: 5000}]
        envFrom:
        - configMapRef: {name: app-config}
        env:
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: db-secret, key: DB_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db-secret, key: DB_PASSWORD}}
        readinessProbe:
          httpGet: {path: /api/health, port: 5000}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /api/health, port: 5000}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports:
  - {port: 5000, targetPort: 5000}
