<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Login Demo</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f2f4f8; display:grid; place-items:center; min-height:100vh; }
    .card { background:white; padding:2rem; border-radius:12px; width:min(320px,90%); box-shadow:0 8px 25px #0001; }
    input,button { width:100%; padding:12px; margin:8px 0; box-sizing:border-box; }
    button { background:#2563eb; color:white; border:0; border-radius:6px; cursor:pointer; }
  </style>
</head>
<body>
  <main class="card">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
    <p id="message"></p>
  </main>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("message").textContent = "Demo form submitted!";
    });
  </script>
</body>
</html>
